<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QuickAds — Instagram Connect</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e7ebf0; --muted:#8b93a1; --accent:#c6ff3a; --ok:#2ec27e; --bad:#ff5a5a; }
    * { box-sizing:border-box; }
    body { width:330px; margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { padding:16px; }
    h1 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
    .row { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px;
      background:var(--card); border:1px solid var(--line); margin-bottom:8px; font-size:13px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
    .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
    .row .sub { color:var(--muted); font-size:11px; margin-top:1px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    button { width:100%; margin-top:10px; padding:10px; border:0; border-radius:9px;
      background:var(--accent); color:#0f1115; font-weight:700; font-size:13px; cursor:pointer; }
    button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .msg { margin-top:10px; font-size:12px; line-height:1.5; color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>QuickAds — Instagram Connect</h1>

    <div class="row">
      <span class="dot" id="dotIg"></span>
      <div style="min-width:0;">
        <div id="igLabel">Checking Instagram…</div>
        <div class="sub" id="igSub"></div>
      </div>
    </div>

    <div class="row">
      <span class="dot" id="dotApp"></span>
      <div style="min-width:0;">
        <div id="appLabel">Looking for your app…</div>
        <div class="sub" id="appSub"></div>
      </div>
    </div>

    <button id="btnOpen">Open QuickAds &amp; connect</button>
    <button id="btnEnableSite" class="ghost" style="display:none;">Use this site as my QuickAds app</button>
    <div class="msg" id="msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
